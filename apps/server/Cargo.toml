version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "selenite_server"
path = "src/lib.rs"

[[bin]]
name = "selenite-server"
path = "src/main.rs"

[dependencies]
selenite-core = { workspace = true }
selenite-storage = { workspace = true }
