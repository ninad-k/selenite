[package]
name = "selenite-desktop"
description = "Desktop shell (Tauri 2) for the notes app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "selenite_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "selenite-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
selenite-core = { workspace = true }
selenite-vault = { workspace = true }
selenite-storage = { workspace = true }
selenite-index = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
